services:
  app:
    build: .
    container_name: ezoffer
    restart: unless-stopped
    # Процесс внутри работает НЕ root (см. USER в Dockerfile), а том ./data
    # принадлежит хосту. Без этой строки на свежей машине каталог data/ создаёт
    # сам Docker от root — и сервер падает с SQLITE_CANTOPEN, т.к. писать некому.
    # UID/GID хост-пользователя подставляются автоматически.
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '3000:3000'
    environment:
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - PORT=3000
      - TZ=Europe/Moscow
      - HH_ACCESS_TOKEN=${HH_ACCESS_TOKEN:-}
    volumes:
      - ./data:/app/data
