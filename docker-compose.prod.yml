# EZOffer — прод-сборка.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Одна команда разворачивает сайт на домене из Caddyfile. Нужен сервер с
# диском: база — это SQLite-файл в томе, и он никуда не мигрирует сама.
#
# Порт 3000 наружу НЕ публикуется: в сеть приложение выходит только через
# Caddy. Так к SQLite-файлу и к внутренним роутам нельзя достучаться в обход
# TLS и заголовков.

services:
  app:
    build: .
    container_name: ezoffer-app
    restart: unless-stopped
    # Процесс внутри работает НЕ root (см. USER в Dockerfile), а том ./data
    # принадлежит хосту. Без этой строки на свежем VPS каталог data/ создаёт
    # сам Docker от root — и сервер падает с SQLITE_CANTOPEN, т.к. писать некому.
    # UID/GID владельца репозитория на сервере подставляются автоматически.
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      - NODE_ENV=production
      # Домен для Caddyfile ({$SITE_HOST} в deploy/Caddyfile) и для ссылок
      # в письмах/боте. Без него — значение по умолчанию ezoffer.ru.
      # Если меняешь SITE_HOST — поменяй и SITE_URL ниже на тот же домен.
      - SITE_HOST=${SITE_HOST:-ezoffer.ru}
      - SITE_URL=${SITE_URL:-https://ezoffer.ru}
      - PORT=3000
      # Московское время внутри контейнера: границы суток, лимиты и «рабочие
      # часы» считаются по Москве. Без TZ сервер живёт в UTC и всё едет на 3 часа.
      - TZ=Europe/Moscow
      - EZOFFER_DB_PATH=/app/data/ezoffer.db
      - EZOFFER_SILENT=0
      # OAuth-приложение hh.ru. Пусто — работает всё, кроме автооткликов.
      - HH_CLIENT_ID=${HH_CLIENT_ID:-}
      - HH_CLIENT_SECRET=${HH_CLIENT_SECRET:-}
      - HH_REDIRECT_URI=${HH_REDIRECT_URI:-}
      # Telegram-бот.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Письма (восстановление пароля).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Улучшение резюме и письма.
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      # Планировщик.
      - SCHEDULER_INTERVAL_MS=${SCHEDULER_INTERVAL_MS:-300000}
      # Лимиты автооткликов. ВНИМАНИЕ: 0 означает «без глобального потолка»,
      # а не «выключено». Пока реальные отклики не нужны — поставьте 1.
      - AUTOAPPLY_DAILY_CAP=${AUTOAPPLY_DAILY_CAP:-1}
      - AUTOAPPLY_HOURLY_CAP=${AUTOAPPLY_HOURLY_CAP:-12}
      - AUTOAPPLY_MIN_INTERVAL_SEC=${AUTOAPPLY_MIN_INTERVAL_SEC:-45}
      - AUTOAPPLY_MAX_INTERVAL_SEC=${AUTOAPPLY_MAX_INTERVAL_SEC:-180}
      # Человеческий профиль отправок (анти-детект): редкие длинные перерывы
      # вместо ровного потока, вдвое меньше объёма в выходные, линейный
      # прогрев нового отправителя за 7 дней. Ноль/пусто — механизм выключен.
      - AUTOAPPLY_LONG_BREAK_CHANCE=${AUTOAPPLY_LONG_BREAK_CHANCE:-0.12}
      - AUTOAPPLY_LONG_BREAK_MIN_SEC=${AUTOAPPLY_LONG_BREAK_MIN_SEC:-900}
      - AUTOAPPLY_LONG_BREAK_MAX_SEC=${AUTOAPPLY_LONG_BREAK_MAX_SEC:-2700}
      - AUTOAPPLY_WEEKEND_FACTOR=${AUTOAPPLY_WEEKEND_FACTOR:-0.5}
      - AUTOAPPLY_WARMUP_DAYS=${AUTOAPPLY_WARMUP_DAYS:-7}
      - TRUST_PROXY=1
    volumes:
      - ./data:/app/data
    # Приложение слушает 0.0.0.0 внутри сети compose, иначе Caddy его не достанет.
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: ezoffer-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты должны пережить пересоздание контейнера, иначе каждый
      # деплой заставляет Let's Encrypt выпускать их заново и рисковать
      # исчерпанием лимита.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
