# Публикация витрины на GitHub Pages.
#
# Что здесь публикуется и что нет. На Pages уезжает ТОЛЬКО публичная часть
# сайта, которую Next пререндерит при сборке. Приложение целиком на Pages не
# работает: там нет Node, нет базы, нет фоновых задач и серверных API. Кабинет,
# бот и автоотклики живут на сервере (docker-compose.prod.yml) — это
# осознанное разделение, а не недоделка.
#
# Если позже появится домен, витрину можно перенести на него и убрать
# basePath: значение ниже — единственное, что привязывает её к /ezzoffer.

name: Publish public site to Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Деплой запускается только после успешного CI того же commit и не отменяет
# уже начатую публикацию другого commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Публичная витрина. Секретов здесь нет и быть не должно: то, что
      # попадает в браузер посетителя, не является секретом.
      NEXT_PUBLIC_BASE_PATH: /ezzoffer
      SITE_URL: https://ssrjkk.github.io/ezzoffer
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_STATIC_EXPORT: "1"
      # Куда ведут CTA витрины (/signup, /login): на Pages этих роутов нет
      # (приложение живёт на сервере), онбординг — через Telegram-бота.
      NEXT_PUBLIC_ONBOARDING_URL: https://t.me/ezzoffer_bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Билд тяжёлый: Turbopack держит много памяти. Без этого указателя
      # сборка на GitHub-раннере умирала с «memory allocation failed».
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - run: node scripts/export-pages.mjs pages-out
        env:
          SITE_URL: https://ssrjkk.github.io/ezzoffer

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
