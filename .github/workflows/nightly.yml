name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-catalog:
    name: Инварианты каталога на живых данных
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # CI проверяет инварианты по снимку каталога, чтобы не падать из-за чужих
      # публикаций. Здесь те же правила прогоняются по живым данным площадок:
      # падение означает «появилась новая формулировка, разобрать её».
      - name: Тесты на живых данных площадок
        env:
          EZOFFER_LIVE_CATALOG: '1'
        run: |
          node --import tsx --test tests/catalog-invariants.test.ts
          node --import tsx --test tests/freelance-sources.test.ts
