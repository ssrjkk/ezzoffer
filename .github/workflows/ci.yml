name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый коммит отменяет предыдущий прогон: экономит минуты и не даёт
# «зелёному» статусу от устаревшей сборки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Без таймаута зависший тест держал бы job до лимита GitHub в 6 часов.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      # У standalone-деплоя нет публичных страниц без БД: если сборка не создала
      # .next/standalone, рантайм в Docker упадёт с «server.js not found».
      - name: Проверка standalone-артефакта
        run: |
          test -f .next/standalone/server.js || {
            echo "::error::standalone-сборка не создана"; exit 1; }
          echo "standalone OK: $(du -sh .next/standalone | cut -f1)"

      # БД с хэшами паролей и OAuth-токенами не должна попадать в образ.
      - name: Локальная БД не попала в сборку
        run: |
          if [ -e .next/standalone/data/ezoffer.db ]; then
            echo "::error::ezoffer.db просочилась в standalone"
            exit 1
          fi
          echo "БД в образе отсутствует — OK"

  # Отдельный аудит: npm audit в основном job падал бы на любой транзитивной
  # уязвимости и блокировал бы релиз, хотя в зависимостях может быть только
  # dev-инструмент (eslint), недоступный в рантайме.
  #
  # Джоба отдельная, но не заглушённая: production-граф проверен и чист
  # (`npm audit --omit=dev` → 0 уязвимостей), поэтому падение здесь — это
  # настоящая новая CVE, а не известный шум. `continue-on-error` убран: с ним
  # джоба светилась бы жёлтым и не валила прогон.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # `--omit=dev`: в dev-цепочке eslint-config-next → fast-glob → braces
      # сидит GHSA-vfj7-8cjw-p6xm, а исправленной braces 3.x нет на registry
      # (3.0.3 — последний выпуск). Production-граф обязан быть чистым, и шаг
      # падает на любой новой CVE.
      - name: Аудит production-зависимостей
        run: npm audit --omit=dev --audit-level=low
