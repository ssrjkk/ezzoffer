name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый коммит отменяет предыдущий прогон: экономит минуты и не даёт
# «зелёному» статусу от устаревшей сборки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Без таймаута зависший тест держал бы job до лимита GitHub в 6 часов.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Линтер
        run: npm run lint

      - name: Сборка
        run: npm run build

      # У standalone-деплоя нет публичных страниц без БД: если сборка не создала
      # .next/standalone, рантайм в Docker упадёт с «server.js not found».
      - name: Проверка standalone-артефакта
        run: |
          test -f .next/standalone/server.js || {
            echo "::error::standalone-сборка не создана"; exit 1; }
          echo "standalone OK: $(du -sh .next/standalone | cut -f1)"

      # БД с хэшами паролей и OAuth-токенами не должна попадать в образ.
      - name: Локальная БД не попала в сборку
        run: |
          if [ -e .next/standalone/data/ezoffer.db ]; then
            echo "::error::ezoffer.db просочилась в standalone"
            exit 1
          fi
          echo "БД в образе отсутствует — OK"

      - name: Установка Chromium
        run: npx playwright install --with-deps chromium

      - name: Подготовка изолированной QA-базы
        run: |
          EZOFFER_DB_PATH="$RUNNER_TEMP/ezoffer-ci.db" \
          SEED_QA_EMAIL=qa2@example.com \
          SEED_QA_PASSWORD=testpass123 \
          npm run seed

      - name: Server и browser tests
        env:
          BASE: http://127.0.0.1:3121
          QA_EMAIL: qa2@example.com
          QA_PASSWORD: testpass123
        run: |
          export EZOFFER_SILENT=1
          EZOFFER_DB_PATH="$RUNNER_TEMP/ezoffer-ci.db" NODE_ENV=production PORT=3121 APP_HOST=127.0.0.1 AUTOAPPLY_ENABLED=0 \
            npm run start:prod >"$RUNNER_TEMP/ezoffer-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3121/api/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/ezoffer-server.log"
            exit 1
          fi
          npm test

  # Отдельный аудит: npm audit в основном job падал бы на любой транзитивной
  # уязвимости и блокировал бы релиз, хотя в зависимостях может быть только
  # dev-инструмент (eslint), недоступный в рантайме.
  #
  # Джоба отдельная, но не заглушённая: production-граф проверен и чист
  # (`npm audit --omit=dev` → 0 уязвимостей), поэтому падение здесь — это
  # настоящая новая CVE, а не известный шум. `continue-on-error` убран: с ним
  # джоба светилась бы жёлтым и не валила прогон.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Production-граф обязан быть чистым; dev-обновления отслеживает Dependabot.
      # Шаг падает на любой новой CVE в production-зависимостях.
      - name: Аудит production-зависимостей
        run: npm audit --omit=dev --audit-level=low

  pages-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /ezzoffer
      SITE_URL: https://ssrjkk.github.io/ezzoffer
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_STATIC_EXPORT: "1"
      NEXT_PUBLIC_ONBOARDING_URL: https://t.me/ezzoffer_bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Сборка статической витрины
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Проверка Pages-экспорта
        run: node scripts/export-pages.mjs pages-out
        env:
          SITE_URL: https://ssrjkk.github.io/ezzoffer
